# Logging overrides used by the basic_usage demo.
# Demonstrates how a local config file changes the defaults.

# Uncomment the `kstlib` block below to turn on kstlib's own internal logs
# without writing any Python. The first call to get_logger() from any
# kstlib module will trigger init_logging() transparently. Unknown presets
# fall back to "prod" with a single stderr notice.
#
# kstlib:
#   logging:
#     enabled: true   # opt-in: internal kstlib logs (mail, rapi, auth, ...)
#     preset: dev     # dev | prod | debug | trace | quiet (from this file)

logger:
  defaults:
    output: console
    icons:
      show: false
    console:
      level: DEBUG
      show_path: false
    theme:
      debug: "black on sky_blue2"
      info: "dark_olive_green3"
      success: "black on spring_green2"
      warning: "bold black on orange1"
      error: "bold white on hot_pink3"
      critical: "blink bold white on red3"
  presets:
    quiet:
      output: file
      file:
        log_dir: logs
        log_name: demo-custom.log
        level: ERROR
